<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />

    <title>Trussardi Residences, Mira Verde Tbilisi | C786 Realty</title>
    <meta
      name="description"
      content="Explore fully furnished studios and 1–2 bedroom residences at Trussardi Residences, Mira Verde in Tbilisi. Request current pricing, availability and investment guidance from C786 Realty."
    />
    <!-- href is rewritten at runtime from VITE_SITE_URL. -->
    <link rel="canonical" href="https://example.invalid" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="C786 Realty" />
    <meta property="og:title" content="Trussardi Residences, Mira Verde Tbilisi | C786 Realty" />
    <meta
      property="og:description"
      content="Fully furnished studios and 1–2 bedroom residences by Trussardi Casa in Georgia’s first branded master-planned community. Request current pricing and availability."
    />
    <meta property="og:url" content="https://example.invalid" />
    <meta property="og:image" content="/media/hero-1600.webp" />
    <meta property="og:image:alt" content="Trussardi Residences at Mira Verde, Tbilisi, at dusk." />
    <meta property="og:locale" content="en" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trussardi Residences, Mira Verde Tbilisi | C786 Realty" />
    <meta
      name="twitter:description"
      content="Fully furnished studios and 1–2 bedroom residences by Trussardi Casa in Georgia’s first branded master-planned community."
    />
    <meta name="twitter:image" content="/media/hero-1600.webp" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Fonts are self-hosted (see src/index.css). Preloaded here because the
         first paint is text, so they sit on the critical path. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-variable.woff2" crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/instrument-serif-400-italic.woff2"
      crossorigin
    />

    <!-- The hero is the LCP element, so its AVIF is fetched alongside the bundle.

         Two preloads, matching the art direction in the markup: phones use a
         portrait render, everything else the landscape one. Without the `media`
         split the browser would preload the landscape file on mobile and then
         never use it — pure waste on the slowest connections. -->
    <link
      rel="preload"
      as="image"
      media="(max-width: 639px)"
      href="/media/hero-m-729.avif"
      imagesrcset="/media/hero-m-420.avif 420w, /media/hero-m-640.avif 640w, /media/hero-m-729.avif 729w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      media="(min-width: 640px)"
      href="/media/hero-1600.avif"
      imagesrcset="/media/hero-640.avif 640w, /media/hero-960.avif 960w, /media/hero-1280.avif 1280w, /media/hero-1600.avif 1600w, /media/hero-1920.avif 1920w, /media/hero-2100.avif 2100w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; color: #f5f5f5; font-family: sans-serif">
        <h1>Trussardi Residences, Mira Verde — Tbilisi</h1>
        <p>
          This page needs JavaScript enabled. To receive current pricing and availability from C786 Realty, please
          enable JavaScript or contact us directly.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
